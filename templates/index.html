<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NANO-CYBER 5S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root { --p-pink: #ff00ff; --p-cyan: #00ffff; --p-green: #39ff14; --p-red: #ff003c; }
        body { font-family: 'JetBrains Mono', monospace; background-color: #030008; color: #fff; padding: 10px; font-size: 10px; }
        .grid-stack-item-content { background: #090016 !important; border: 1px solid #1a0033 !important; }

        /* 5-second heartbeat animation */
        .heartbeat { animation: pulse-red 5s ease-in-out infinite; }
        @keyframes pulse-red { 0% { opacity: 0.2; } 10% { opacity: 1; } 100% { opacity: 0.2; } }

        .flag-fire { background: var(--p-pink); color: #fff; animation: blink 0.2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .m-bull { color: var(--p-green); text-shadow: 0 0 5px var(--p-green); }
        .m-death { color: var(--p-red); text-shadow: 0 0 5px var(--p-red); }
    </style>
</head>
<body>
    <header class="flex justify-between items-center mb-2 pb-1 border-b border-white/10">
        <h1 class="text-[10px] font-black uppercase text-pink-500">HF_NANO <span class="text-cyan-400">7.5</span></h1>
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-red-600 heartbeat"></div>
            <div id="status" class="text-[8px] font-bold opacity-50">5S_POLLING_ACTIVE</div>
        </div>
    </header>
    <div class="grid-stack"></div>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
    <script>
        const grid = GridStack.init({ cellHeight: 165, margin: 4, column: 12, disableResize: true });
        const widgets = {};

        async function update() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                data.forEach((asset, i) => {
                    const isFire = asset.signal_flag === "FIRE";
                    const macdClass = asset.macd_status === "BULL_CROSS" ? 'm-bull' : (asset.macd_status === "DEATH_CROSS" ? 'm-death' : '');
                    const macdLabel = asset.macd_status === "BULL_CROSS" ? '▲ MACD' : (asset.macd_status === "DEATH_CROSS" ? '▼ MACD' : 'SIDE');

                    const html = `
                        <div class="h-4 w-full ${isFire ? 'flag-fire' : 'bg-white/5'} flex items-center justify-center text-[7px] font-black">${asset.signal_flag}</div>
                        <div class="p-2 flex flex-col h-full justify-between">
                            <div class="flex justify-between items-start">
                                <div><b class="text-xs text-white">${asset.asset}</b><div class="text-[7px] text-cyan-400 font-bold">${asset.trend}</div></div>
                                <div class="px-1 bg-white text-black text-[7px] font-bold uppercase">${asset.action}</div>
                            </div>
                            <div class="flex items-center justify-between">
                                <div>
                                    <div class="text-base font-black text-white">${asset.price}</div>
                                    <div class="text-[7px] font-bold ${asset.delta.includes('+') ? 'text-green-500' : 'text-red-500'}">${asset.delta}</div>
                                </div>
                                <div class="text-[10px] font-black ${macdClass}">${macdLabel}</div>
                            </div>
                            <div class="space-y-1">
                                <div class="h-1 w-full bg-white/5"><div class="h-full bg-gradient-to-r from-cyan-400 to-pink-500 transition-all duration-500" style="width: ${asset.squeeze_pct}"></div></div>
                                <div class="flex justify-between text-[6px] font-bold uppercase text-gray-500"><span>SQZ: ${asset.squeeze_pct}</span><span>MOD: 5S</span></div>
                            </div>
                            <div class="pt-1 flex justify-between items-center text-[7px] font-bold border-t border-white/5">
                                <div class="flex gap-2 text-cyan-500"><span>RSI:${asset.rsi}</span><span>ADX:${asset.adx}</span></div>
                                <div class="text-yellow-400 tracking-tighter">${asset.logic_lock}</div>
                            </div>
                        </div>`;
                    if (!widgets[asset.asset]) {
                        const el = document.createElement('div');
                        el.innerHTML = `<div class="grid-stack-item-content h-full" id="card-${asset.asset}">${html}</div>`;
                        grid.addWidget(el, { x: (i % 4) * 3, y: Math.floor(i / 4), w: 3, h: 1 });
                        widgets[asset.asset] = true;
                    } else {
                        document.getElementById(`card-${asset.asset}`).innerHTML = html;
                    }
                });
            } catch (e) { console.error(e); }
        }
        update();
        setInterval(update, 5000); // Polling every 5 seconds
    </script>
</body>
</html>
