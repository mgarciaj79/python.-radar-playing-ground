<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NANO-CORE // V7.5 BUSINESS</title>
    <style>
        :root { --bg: #010204; --cyan: #00f2ff; --pink: #ff0055; --green: #00ff66; --yellow: #f0ff00; }
        body {
            background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; margin: 0; padding: 15px;
            background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #222; margin-bottom: 20px; padding: 10px; font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .widget { background: #08080a; border: 1px solid #1a1a1a; position: relative; border-bottom: 5px solid var(--signal-color); transition: all 0.3s; }
        .widget.active-snipe { animation: pulse-glow 1s infinite; }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 5px var(--signal-color); } 50% { box-shadow: 0 0 25px var(--signal-color); } 100% { box-shadow: 0 0 5px var(--signal-color); } }
        .price { font-size: 2.2rem; font-family: monospace; margin: 5px 0; font-weight: bold; }
        .action-zone { margin-top: 15px; padding: 12px; text-align: center; font-weight: 900; color: #000; background: var(--signal-color); }
        .hazard { height: 6px; background: repeating-linear-gradient(45deg, var(--yellow), var(--yellow) 10px, #000 10px, #000 20px); }
        .badge { font-size: 0.6rem; color: var(--yellow); border: 1px solid var(--yellow); padding: 2px 5px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div>30M INTERVAL // <span style="color:var(--yellow)">DYNAMIC ROTATION ACTIVE</span></div>
        <div id="sync">SYNCING RADAR...</div>
    </div>
    <div class="grid" id="main-grid"></div>

    <script>
        const originalTitle = document.title;
        let alertInterval = null;

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { clearInterval(alertInterval); alertInterval = null; document.title = originalTitle; }
        });

        function flashAlert() {
            if (document.hidden && !alertInterval) {
                alertInterval = setInterval(() => { document.title = document.title === "!!! SNIPE !!!" ? "CHECK BUSINESS" : "!!! SNIPE !!!"; }, 1000);
            }
        }

        async function update() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                const grid = document.getElementById('main-grid');
                grid.innerHTML = '';
                let snipeDetected = false;

                data.forEach(item => {
                    const isSnipe = item.instruction.includes("SNIPE");
                    if (isSnipe) snipeDetected = true;

                    const div = document.createElement('div');
                    div.className = `widget ${isSnipe ? 'active-snipe' : ''}`;
                    div.style.setProperty('--signal-color', item.signal_color);
                    div.innerHTML = `
                        <div class="hazard"></div>
                        <div class="content" style="padding:15px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-size:1.4rem; color:var(--cyan); font-weight:900;">${item.asset}</span>
                                ${item.tag === 'TOP MOVER' ? '<span class="badge">ALPHA MOVER</span>' : ''}
                            </div>
                            <div class="price">$${item.price}</div>
                            <div style="color:${item.delta.includes('+') ? '#0f0':'#f00'}; font-size:0.9rem;">${item.delta}</div>
                            <div class="action-zone">${item.instruction} [${item.action_type}]</div>
                        </div>
                    `;
                    grid.appendChild(div);
                });

                if (snipeDetected) flashAlert();
                document.getElementById('sync').innerText = "RADAR SYNC: " + new Date().toLocaleTimeString();
            } catch (e) { console.error(e); }
        }

        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
