<!DOCTYPE html>
<html>
<head>
    <title>SHARKY V12.8 // SNIPE-PROB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030305; --magenta: #FF00FF; --orange: #FF4D00; --purple: #9D00FF; --neon-blue: #00E5FF; --acid-green: #39FF14; }
        body { background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--purple); padding-bottom: 10px; margin-bottom: 20px; }
        #terminal { background: #000; border: 1px solid var(--purple); height: 50px; overflow: hidden; padding: 10px; font-family: monospace; color: var(--acid-green); font-size: 0.7rem; border-radius: 4px; margin-bottom: 20px; line-height: 30px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        .widget { background: #0A0A0F; border: 1px solid #1A1A2E; border-top: 4px solid var(--color); padding: 25px; border-radius: 12px; transition: transform 0.5s ease; box-shadow: 0 4px 30px rgba(0,0,0,0.9); }
        .price { font-size: 2.2rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; margin: 5px 0; color: #fff; }

        /* PROBABILITY BAR STYLES */
        .prob-container { width: 100%; height: 6px; background: #111; border-radius: 3px; margin: 15px 0; overflow: hidden; border: 1px solid #222; }
        .prob-bar { height: 100%; transition: width 0.8s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .prob-text { font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; display: flex; justify-content: space-between; }

        .status-tag { font-size: 0.75rem; font-weight: 900; color: var(--color); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .gauge-wrap { position: relative; width: 180px; height: 90px; margin: 10px auto; overflow: hidden; border-bottom: 1px solid #222; }
        .gauge-bg { width: 180px; height: 180px; border: 12px solid #111; border-radius: 50%; border-top-color: var(--acid-green); border-right-color: var(--orange); border-left-color: var(--magenta); opacity: 0.15; }
        .needle { width: 4px; height: 80px; background: #fff; position: absolute; bottom: 0; left: 50%; transform-origin: bottom center; transition: 1s; box-shadow: 0 0 10px #fff; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 15px; }
        .box { background: #000; padding: 8px; border: 1px solid #1A1A2E; text-align: center; border-radius: 4px; }
        .val { display: block; font-size: 0.75rem; font-weight: 900; color: var(--neon-blue); font-family: 'JetBrains Mono', monospace; }
        .lbl { font-size: 0.45rem; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="header">
        <div><span style="color:var(--magenta); font-size:1.8rem; font-weight:900;">SHARKY</span><span style="color:#fff; font-size:1rem; margin-left:10px;">V12.8 // NEURAL-SYNC</span></div>
        <div id="clock">00:00:00</div>
    </div>
    <div id="terminal">--- RANKING BY SNIPE PROBABILITY // INTERVAL: 30M ---</div>
    <div class="grid" id="grid"></div>

    <script>
        function clock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
        setInterval(clock, 1000);

        async function refresh() {
            try {
                const r = await fetch('/api/data');
                const data = await r.json();
                const grid = document.getElementById('grid');
                if (!data) return;

                grid.innerHTML = data.map(item => {
                    const volFmt = item.volume > 1000000 ? (item.volume / 1000000).toFixed(1) + "M" : (item.volume / 1000).toFixed(1) + "K";
                    const probColor = item.snipe_prob > 75 ? 'var(--acid-green)' : (item.snipe_prob > 45 ? 'var(--orange)' : 'var(--purple)');

                    return `
                        <div class="widget" style="--color:${item.color}">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-size:1.6rem; font-weight:900; color:#fff">${item.asset}</span>
                                <span style="font-size:0.6rem; color:var(--color); border:1px solid var(--color); padding:2px 8px;">30M</span>
                            </div>

                            <div class="prob-container">
                                <div class="prob-bar" style="width:${item.snipe_prob}%; background:${probColor}; box-shadow: 0 0 10px ${probColor};"></div>
                            </div>
                            <div class="prob-text" style="color:${probColor}">
                                <span>SNIPE PROBABILITY</span>
                                <span>${item.snipe_prob}%</span>
                            </div>

                            <div class="price" style="margin-top:10px;">$${item.price.toFixed(4)}</div>
                            <span class="status-tag">${item.status}</span>

                            <div class="gauge-wrap"><div class="gauge-bg"></div><div class="needle" style="transform: rotate(${item.rotation}deg)"></div></div>

                            <div class="stat-grid">
                                <div class="box"><span class="val">${volFmt}</span><span class="lbl">VOL</span></div>
                                <div class="box"><span class="val">${item.atr.toFixed(4)}</span><span class="lbl">ATR</span></div>
                                <div class="box"><span class="val">${item.adx.toFixed(2)}</span><span class="lbl">ADX</span></div>
                                <div class="box"><span class="val">${item.rsi.toFixed(2)}</span><span class="lbl">RSI</span></div>
                            </div>

                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                                <div class="box" style="border-top:3px solid var(--acid-green)"><span class="lbl">TGT</span><span class="val" style="color:var(--acid-green)">$${item.target.toFixed(4)}</span></div>
                                <div class="box" style="border-top:3px solid var(--magenta)"><span class="lbl">STP</span><span class="val" style="color:var(--magenta)">$${item.stop.toFixed(4)}</span></div>
                            </div>
                        </div>`;
                }).join('');
            } catch (e) { console.error("Sync Error"); }
        }
        setInterval(refresh, 5000); refresh(); clock();
    </script>
</body>
</html>
