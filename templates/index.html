<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARKY-MGJ // NEON HYDRA V53.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-orange: #ff8c00;
            --neon-purple: #bf00ff;
            --bg-dark: #0a0a0f;
            --bg-darker: #050508;
            --bg-card: rgba(16, 20, 30, 0.95);
            --glow-cyan: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: #fff;
            font-family: 'Orbitron', 'Consolas', monospace;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { box-shadow: var(--glow-cyan); border-color: var(--neon-cyan); }
            50% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.8); border-color: #fff; }
        }

        .title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .highlight {
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { text-shadow: var(--glow-cyan); }
            50% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.8); }
        }

        .version-badge {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 15px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .clock {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            font-family: monospace;
        }

        .stats-bar {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid var(--neon-cyan);
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            gap: 10px;
            align-items: baseline;
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(0, 243, 255, 0.1);
            transform: translateY(-2px);
        }

        .stat-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            color: var(--neon-cyan);
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: var(--glow-cyan);
        }

        .grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 25px;
        }

        .widget {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .widget::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink), var(--neon-cyan));
            border-radius: 20px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .widget:hover::before {
            opacity: 0.3;
        }

        .widget:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--glow-cyan);
        }

        .snipe-long {
            border: 2px solid var(--neon-cyan);
            animation: snipeLongPulse 1s ease-in-out infinite;
            box-shadow: var(--glow-cyan);
        }

        .snipe-short {
            border: 2px solid var(--neon-orange);
            animation: snipeShortPulse 1s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.5);
        }

        @keyframes snipeLongPulse {
            0%, 100% { box-shadow: var(--glow-cyan); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); transform: scale(1.02); }
        }

        @keyframes snipeShortPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 140, 0, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(255, 140, 0, 0.8); transform: scale(1.02); }
        }

        .breathing {
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; transform: scale(1); filter: brightness(1); }
            50% { opacity: 1; transform: scale(1.02); filter: brightness(1.2); }
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .symbol {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .symbol-icon {
            font-size: 1.5rem;
            animation: iconRotate 4s linear infinite;
        }

        @keyframes iconRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-badge {
            background: rgba(0, 243, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--neon-cyan);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .price-section {
            text-align: center;
            margin: 15px 0;
        }

        .price {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 10px 0;
        }

        .price-change {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .positive {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .negative {
            background: rgba(255, 49, 49, 0.2);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .neutral {
            background: rgba(136, 136, 136, 0.2);
            color: #888;
            border: 1px solid #888;
        }

        /* PROMINENT GAUGE STYLES */
        .gauge-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .gauge-title {
            text-align: center;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .gauge-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .gauge-bar-container {
            position: relative;
            width: 100%;
            height: 40px;
            background: linear-gradient(90deg, #1a1a2e, #2a2a3e, #3a3a4e, #2a2a3e);
            border-radius: 20px;
            overflow: visible;
            margin: 10px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .gauge-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            transition: width 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.3);
        }

        .gauge-needle {
            position: absolute;
            top: -12px;
            width: 4px;
            height: 64px;
            background: white;
            box-shadow: 0 0 15px white;
            transform-origin: center;
            transition: left 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            border-radius: 2px;
            z-index: 10;
        }

        .gauge-needle::before {
            content: '▼';
            position: absolute;
            top: -20px;
            left: -8px;
            font-size: 14px;
            color: white;
            text-shadow: 0 0 5px white;
        }

        .gauge-needle::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: -6px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, white, #00f3ff);
            border-radius: 50%;
            box-shadow: 0 0 10px cyan;
        }

        .gauge-markers {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            padding: 0 5px;
            font-size: 0.7rem;
            color: #888;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(0, 243, 255, 0.1);
            transform: translateY(-2px);
        }

        .stat-card-label {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .target-zone {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(255, 0, 255, 0.1));
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid var(--neon-cyan);
            transition: all 0.3s ease;
        }

        .target-zone:hover {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 255, 0.2));
            box-shadow: var(--glow-cyan);
        }

        .update-time {
            margin-top: 15px;
            text-align: right;
            color: #666;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            padding: 80px;
            color: var(--neon-cyan);
            font-size: 1.3rem;
            grid-column: 1 / -1;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.5; text-shadow: none; }
            50% { opacity: 1; text-shadow: var(--glow-cyan); }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .title { font-size: 1rem; }
            .clock { font-size: 1rem; }
            .price { font-size: 1.5rem; }
            .grid { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; }
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-pink);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">
            🦈 SHARKY-MGJ // <span class="highlight">NEON HYDRA V53.0</span>
            <span class="version-badge">⚡ NO-BAN EDITION</span>
        </div>
        <div id="clock" class="clock">00:00:00</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">🟢 ACTIVE SYMBOLS</span>
            <span id="symbol-count" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">🎯 SNIPE SIGNALS</span>
            <span id="snipe-count" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">⚡ MARKET STATUS</span>
            <span id="update-status" class="stat-value">LIVE</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">🔄 LAST UPDATE</span>
            <span id="last-update" class="stat-value">--:--:--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">💎 MARKET BREATHING</span>
            <span id="breathing-count" class="stat-value">0</span>
        </div>
    </div>

    <div id="grid" class="grid">
        <div class="loading">⚡ INITIALIZING NEON HYDRA CORE V53.0... ⚡</div>
    </div>

    <script>
        const SYMBOL_ICONS = {
            'BTC': '₿', 'ETH': '⟠', 'SOL': '◎', 'TON': '⚡',
            'LINK': '🔗', 'HBAR': '💎', 'FET': '🤖', 'TIA': '🌙'
        };

        class NeonDashboard {
            constructor() {
                this.dataCache = null;
                this.init();
            }

            init() {
                this.startClock();
                this.startDataUpdates();
                console.log('[NEON] Dashboard V53.0 Initialized - NO BAN GUARANTEED');
            }

            startClock() {
                setInterval(() => {
                    const now = new Date();
                    document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB');
                }, 1000);
            }

            async fetchMarketData() {
                try {
                    const response = await fetch('/api/data');
                    if (!response.ok) throw new Error('Network error');
                    this.dataCache = await response.json();
                    this.updateDashboard();
                    this.updateStats();
                } catch (error) {
                    console.error('Error:', error);
                    this.showError();
                }
            }

            updateDashboard() {
                const grid = document.getElementById('grid');
                if (!grid) return;

                if (this.dataCache && this.dataCache.length > 0) {
                    grid.innerHTML = this.dataCache.map(item => this.createWidgetHTML(item)).join('');
                }
            }

            createWidgetHTML(item) {
                const snipeClass = item.is_snipe ?
                    (item.snipe_type === 'LONG' ? 'snipe-long' : 'snipe-short') : '';
                const breathingClass = item.volume_breathing ? 'breathing' : '';
                const priceChangeClass = item.price_change > 0 ? 'positive' : (item.price_change < 0 ? 'negative' : 'neutral');
                const priceChangeSign = item.price_change > 0 ? '+' : '';
                const rsiColor = parseFloat(item.rsi) > 70 ? 'var(--neon-red)' :
                                (parseFloat(item.rsi) < 30 ? 'var(--neon-green)' : 'var(--neon-cyan)');
                const symbolIcon = SYMBOL_ICONS[item.symbol] || '💰';

                // Determine gauge color based on ADX strength
                let gaugeColor = 'linear-gradient(90deg, #00f3ff, #ff00ff)';
                if (item.adx_strength === 'EXTREME') gaugeColor = 'linear-gradient(90deg, #ff00ff, #ff00ff)';
                else if (item.adx_strength === 'STRONG') gaugeColor = 'linear-gradient(90deg, #ff4444, #ff8c00)';
                else if (item.adx_strength === 'MODERATE') gaugeColor = 'linear-gradient(90deg, #ff8c00, #ffff00)';

                return `
                    <div class="widget ${snipeClass} ${breathingClass}">
                        <div class="widget-header">
                            <div class="symbol">
                                <span class="symbol-icon">${symbolIcon}</span>
                                <span>${item.symbol}/USDT</span>
                            </div>
                            <span class="status-badge">🔴 LIVE</span>
                        </div>

                        <div class="price-section">
                            <div class="price" style="color: ${item.e_color}">$${item.price}</div>
                            <div class="price-change ${priceChangeClass}">
                                <span style="font-size: 1.5rem;">${item.arrow}</span>
                                <span>${priceChangeSign}${item.price_change}%</span>
                                <span>${item.price_tendency}</span>
                            </div>
                        </div>

                        <!-- PROMINENT GAUGE -->
                        <div class="gauge-container">
                            <div class="gauge-title">⚡ ADX TREND STRENGTH GAUGE ⚡</div>
                            <div class="gauge-label">
                                <span>📉 WEAK</span>
                                <span style="color: ${item.e_color}; font-size: 1.1rem;">${item.adx} | ${item.adx_strength}</span>
                                <span>STRONG 📈</span>
                            </div>
                            <div class="gauge-bar-container">
                                <div class="gauge-fill" style="width: ${item.adx_gauge}%; background: ${gaugeColor}"></div>
                                <div class="gauge-needle" style="left: ${item.adx_gauge}%"></div>
                            </div>
                            <div class="gauge-markers">
                                <span>0</span>
                                <span>25</span>
                                <span>50</span>
                                <span>75</span>
                                <span>100</span>
                            </div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-card-label">📊 ROC 15M</div>
                                <div class="stat-card-value" style="color: ${item.color}">${item.roc}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-card-label">🔄 RSI</div>
                                <div class="stat-card-value" style="color: ${rsiColor}">${item.rsi}</div>
                            </div>
                        </div>

                        <div class="target-zone">🎯 ${item.tgt}</div>
                        <div class="update-time">⏱️ ${item.upd}</div>
                    </div>
                `;
            }

            updateStats() {
                const symbolCount = document.getElementById('symbol-count');
                const snipeCount = document.getElementById('snipe-count');
                const breathingCount = document.getElementById('breathing-count');
                const lastUpdate = document.getElementById('last-update');

                if (symbolCount && this.dataCache) symbolCount.textContent = this.dataCache.length;
                if (snipeCount && this.dataCache) snipeCount.textContent = this.dataCache.filter(i => i.is_snipe).length;
                if (breathingCount && this.dataCache) breathingCount.textContent = this.dataCache.filter(i => i.volume_breathing).length;
                if (lastUpdate && this.dataCache && this.dataCache[0]) lastUpdate.textContent = this.dataCache[0].upd;
            }

            showError() {
                const grid = document.getElementById('grid');
                if (grid && (!this.dataCache || this.dataCache.length === 0)) {
                    grid.innerHTML = '<div class="loading" style="color: var(--neon-red);">⚠️ CONNECTION ERROR - RETRYING... ⚠️</div>';
                }
            }

            startDataUpdates() {
                this.fetchMarketData();
                setInterval(() => this.fetchMarketData(), 5000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.dashboard = new NeonDashboard();
        });
    </script>
</body>
</html>
