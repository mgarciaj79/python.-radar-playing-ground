<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SHARKY MULTI-CORE v60.0.9 // MGJ79</title>
    <style>
        :root {
            --bg: #020205; --neon-blue: #00f3ff; --neon-purple: #9d00ff;
            --neon-green: #39ff14; --neon-red: #ff3131; --neon-yellow: #fefe00;
            --stellar-orange: #ff8c00; --supernova-pink: #ff00ff;
        }
        body {
            background-color: var(--bg); color: #e1e1f0; font-family: 'JetBrains Mono', 'SF Mono', monospace;
            padding: 15px; margin: 0; overflow-x: hidden;
        }
        .sys-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1a1a3a; padding-bottom: 10px; margin-bottom: 15px;
        }
        .hw-stats {
            font-size: 0.65rem; color: var(--neon-green); text-transform: uppercase;
            letter-spacing: 1px; display: flex; gap: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas fijas */
            grid-template-rows: repeat(2, 1fr);    /* 2 filas fijas */
            gap: 12px;
            height: calc(100vh - 80px);
        }
        .card {
            background: rgba(10, 10, 25, 0.8); border: 1px solid #1a1a4a;
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* DINÁMICA DE FASES */
        .phase-IGNITION { border-color: var(--stellar-orange); box-shadow: inset 0 0 10px rgba(255, 140, 0, 0.2); }
        .phase-MAIN_SEQUENCE { border-color: var(--neon-yellow); box-shadow: 0 0 15px rgba(254, 254, 0, 0.15); }
        .phase-SUPERNOVA { border-color: var(--supernova-pink); animation: vibr-shk 0.2s infinite; }

        @keyframes vibr-shk { 0% { transform: scale(1.01); } 50% { transform: scale(0.99); } 100% { transform: scale(1.01); } }

        .symbol-tag { font-weight: 900; color: var(--neon-blue); font-size: 1.1rem; }
        .price-val { font-size: 1.8rem; font-weight: 800; text-align: center; color: #fff; margin: 5px 0; }

        /* EL NÚCLEO ESTELAR (REDISEÑADO) */
        .core-container { height: 40px; display: flex; align-items: center; justify-content: center; }
        .stellar-core {
            width: 15px; height: 15px; border-radius: 50%;
            filter: blur(1px); transition: 0.5s;
        }
        .pulse { animation: core-pulse 1s infinite alternate; }
        @keyframes core-pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.6); opacity: 1; } }

        .metrics-row { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 5px; }
        .metric-item { text-align: center; }
        .metric-label { font-size: 0.5rem; color: #666; display: block; }
        .metric-val { font-size: 0.8rem; font-weight: bold; }

        .signal-box {
            margin-top: 8px; padding: 8px; border-radius: 6px; text-align: center;
            font-weight: 900; font-size: 1.2rem; border: 1px solid #333;
        }
        .rec-footer { font-size: 0.55rem; color: #888; margin-top: 5px; text-align: center; line-height: 1.2; }
    </style>
</head>
<body>
    <div class="sys-header">
        <div>
            <span style="font-weight:900; color:var(--neon-yellow); font-size: 1.4rem;">SHARKY v60.0.9</span>
            <span style="font-size:0.6rem; color:var(--neon-blue); margin-left:10px;">MULTI-CORE ENGINE ACTIVE</span>
        </div>
        <div class="hw-stats">
            <span>CPU: OPTIMIZED</span>
            <span>RAM: 128GB DETECTED</span>
            <span>GPU: RTX 5090 LINK</span>
            <span id="timer" style="color:#fff">00:00:00</span>
        </div>
    </div>

    <div id="stellar-grid" class="grid"></div>

    <script>
        function updateTime() { document.getElementById('timer').innerText = new Date().toLocaleTimeString('en-GB'); }

        async function fetchTelemetry() {
            try {
                const r = await fetch('/api/data');
                const data = await r.json();
                const grid = document.getElementById('stellar-grid');

                grid.innerHTML = data.map(coin => {
                    const isStable = coin.stellar_phase === 'MAIN_SEQUENCE';
                    const isSuper = coin.stellar_phase === 'SUPERNOVA';
                    const sigColor = coin.signal.action === 'LONG' ? 'var(--neon-green)' : (coin.signal.action === 'SHORT' ? 'var(--neon-red)' : '#555');

                    let coreColor = 'var(--neon-blue)';
                    if(isStable) coreColor = 'var(--neon-yellow)';
                    if(isSuper) coreColor = 'var(--supernova-pink)';
                    if(coin.stellar_phase === 'IGNITION') coreColor = 'var(--stellar-orange)';

                    return `
                    <div class="card phase-${coin.stellar_phase}">
                        <div style="display:flex; justify-content:space-between">
                            <span class="symbol-tag">${coin.symbol}</span>
                            <span style="font-size:0.5rem; color:#aaa">${coin.timestamp}</span>
                        </div>

                        <div class="price-val">$${coin.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>

                        <div class="core-container">
                            <div class="stellar-core ${isStable ? 'pulse' : ''}" style="background: ${coreColor}; box-shadow: 0 0 10px ${coreColor}"></div>
                        </div>

                        <div class="metrics-row">
                            <div class="metric-item">
                                <span class="metric-label">ADX</span>
                                <span class="metric-val" style="color:var(--neon-yellow)">${coin.adx}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">RSI</span>
                                <span class="metric-val" style="color:var(--neon-purple)">${coin.rsi}</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">VOL</span>
                                <span class="metric-val" style="color:${coin.change >=0 ? 'var(--neon-green)' : 'var(--neon-red)'}">${coin.change}%</span>
                            </div>
                        </div>

                        <div class="signal-box" style="color: ${sigColor}; border-color: ${sigColor}44; background: ${sigColor}11">
                            ${coin.signal.action} ${coin.signal.leverage}X
                        </div>

                        <div class="rec-footer">${coin.signal.recommendation}</div>
                    </div>`;
                }).join('');
            } catch (e) { console.error("Telemetry failure", e); }
        }

        setInterval(updateTime, 1000);
        setInterval(fetchTelemetry, 2000);
        fetchTelemetry(); updateTime();
    </script>
</body>
</html>
